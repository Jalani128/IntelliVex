<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131f4e"/><stop offset="1" stop-color="#22336f"/></linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.4" r="0.6"><stop offset="0" stop-color="#3076ff" stop-opacity="0.5"/><stop offset="1" stop-color="#3076ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3076ff"/><stop offset="1" stop-color="#b9cdf2"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.06"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Optimised route -->
  <path d="M150 620 C300 620 300 420 450 420 S620 230 780 260 S1000 420 1060 220" fill="none" stroke="#b9cdf2" stroke-opacity="0.25" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 620 C300 620 300 420 450 420 S620 230 780 260 S1000 420 1060 220" fill="none" stroke="url(#ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 22"/>

  <!-- Stops -->
  <circle cx="150" cy="620" r="30" fill="#0e1a47" stroke="#3076ff" stroke-width="8"/>
  <circle cx="450" cy="420" r="26" fill="#0e1a47" stroke="#b9cdf2" stroke-width="7"/>
  <circle cx="780" cy="260" r="26" fill="#0e1a47" stroke="#b9cdf2" stroke-width="7"/>
  <path d="M1060 140 c-34 0 -58 26 -58 58 c0 44 58 100 58 100 s58 -56 58 -100 c0 -32 -24 -58 -58 -58z" fill="url(#ac)"/>
  <circle cx="1060" cy="196" r="20" fill="#0e1a47"/>

  <!-- Truck -->
  <g transform="translate(520 500)">
    <rect x="0" y="0" width="300" height="150" rx="18" fill="url(#ac)"/>
    <path d="M300 40 H390 L450 100 V150 H300 Z" fill="#0e1a47" stroke="#b9cdf2" stroke-width="5" stroke-linejoin="round"/>
    <path d="M320 58 H382 L420 98 H320 Z" fill="#b9cdf2" fill-opacity="0.55"/>
    <rect x="30" y="35" width="150" height="18" rx="9" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="30" y="68" width="100" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="80" cy="165" r="36" fill="#0e1a47" stroke="#ffffff" stroke-width="10"/>
    <circle cx="370" cy="165" r="36" fill="#0e1a47" stroke="#ffffff" stroke-width="10"/>
  </g>

  <!-- ETA card -->
  <rect x="120" y="150" width="300" height="150" rx="24" fill="#0e1a47" stroke="#3076ff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="180" cy="225" r="30" fill="none" stroke="#b9cdf2" stroke-width="6"/>
  <path d="M180 205 V225 L195 238" fill="none" stroke="#b9cdf2" stroke-width="6" stroke-linecap="round"/>
  <rect x="235" y="200" width="150" height="18" rx="9" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="235" y="232" width="100" height="14" rx="7" fill="#b9cdf2" fill-opacity="0.5"/>
</svg>
